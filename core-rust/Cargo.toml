[package]
name = "spotifast-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
tokio = { version = "1.38", features = ["full"] }
log = "0.4"
android_logger = "0.14"
lazy_static = "1.4"
parking_lot = "0.12"

# Librespot 0.8
librespot-core = "0.8"
librespot-playback = { version = "0.8", default-features = false, features = ["rodio-backend"] }
librespot-connect = "0.8"
librespot-metadata = "0.8"
